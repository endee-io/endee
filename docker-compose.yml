# Endee Vector Database – local development setup
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f endee

services:
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    volumes:
      - ./endee-data:/data
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: unless-stopped
    # Uncomment below to enable token auth:
    # environment:
    #   - NDD_AUTH_TOKEN=your_secret_token
