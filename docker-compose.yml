version: '3.8'

services:
  endee:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        BUILD_ARCH: avx2
        DEBUG: false
    container_name: endee-server
    ports:
      - "3001:8080"
    volumes:
      - endee-data:/data
    environment:
      - NDD_DATA_DIR=/data
      - NDD_SERVER_PORT=8080
      - NDD_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  endee-data:
    driver: local
